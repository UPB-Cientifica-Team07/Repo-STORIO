syntax = "proto3";

package monitoring;

option go_package = "github.com/UPB-Cientifica-Team07/Repo-STORIO/services/monitoring-service/generated;generated";

// =====================================
// SERVICIO DE MONITOREO
// =====================================

service MonitoringService {

    // =====================================
    // MÉTRICAS
    // =====================================

    rpc ReportMetrics(MetricsRequest)
        returns (MetricsResponse);

    rpc GetMetrics(GetMetricsRequest)
        returns (GetMetricsResponse);

    // =====================================
    // ESTADOS DE SERVICIO
    // =====================================

    rpc ReportStatus(StatusRequest)
        returns (StatusResponse);

    rpc GetServiceStatus(ServiceRequest)
        returns (ServiceResponse);

    // =====================================
    // NODOS HPC
    // =====================================

    rpc GetNodeStatus(NodeRequest)
        returns (NodeResponse);

    rpc GetHpcSummary(GetHpcSummaryRequest)
        returns (HpcSummaryResponse);

    // =====================================
    // REGLAS DE ALERTA
    // =====================================

    rpc CreateAlertRule(CreateAlertRuleRequest)
        returns (CreateAlertRuleResponse);

    rpc UpdateAlertRule(UpdateAlertRuleRequest)
        returns (UpdateAlertRuleResponse);

    rpc DeleteAlertRule(DeleteAlertRuleRequest)
        returns (DeleteAlertRuleResponse);

    rpc GetAlertRules(GetAlertRulesRequest)
        returns (GetAlertRulesResponse);

    // =====================================
    // ALERTAS GENERADAS
    // =====================================

    rpc GetAlerts(GetAlertsRequest)
        returns (GetAlertsResponse);
}

// =====================================
// MÉTRICAS
// =====================================

message MetricsRequest {
    string component_id = 1;
    string component_name = 2;

    double cpu_usage = 3;
    double memory_usage = 4;

    int64 active_connections = 5;
    int64 total_requests = 6;

    int64 timestamp = 7;

    int64 storage_usage = 8;
}

message MetricsResponse {
    bool success = 1;
    string message = 2;
}

// =====================================
// CONSULTAR MÉTRICAS
// =====================================

message GetMetricsRequest {
}

message Metric {
    string component_id = 1;
    string component_name = 2;

    double cpu_usage = 3;
    double memory_usage = 4;

    int64 active_connections = 5;
    int64 total_requests = 6;

    int64 timestamp = 7;

    int64 storage_usage = 8;
}

message GetMetricsResponse {
    repeated Metric metrics = 1;
}

// =====================================
// ESTADOS DE SERVICIO
// =====================================

message StatusRequest {
    string component_id = 1;
    string component_name = 2;

    string status = 3;
    string message = 4;

    int64 timestamp = 5;
}

message StatusResponse {
    bool success = 1;
    string message = 2;
}

// =====================================
// CONSULTAR ESTADO DE SERVICIO
// =====================================

message ServiceRequest {
    string component_name = 1;
}

message ServiceResponse {
    string component_id = 1;
    string component_name = 2;

    string status = 3;
    string message = 4;

    int64 last_updated = 5;
}

// =====================================
// NODOS HPC
// =====================================

message NodeRequest {
    string node_id = 1;
}

message NodeResponse {
    string node_id = 1;
    string hostname = 2;

    string status = 3;

    int32 cpu_cores = 4;
    int64 memory = 5;

    double cpu_usage = 6;
    double memory_usage = 7;

    int64 last_updated = 8;

    string ip = 9;
    string location = 10;
}

// =====================================
// MODELO DE REGLA DE ALERTA
// =====================================

message AlertRule {
    string id = 1;

    string name = 2;

    string metric = 3;

    string operator = 4;

    double threshold = 5;

    string component_name = 6;

    bool enabled = 7;
}

// =====================================
// CREAR REGLA DE ALERTA
// =====================================

message CreateAlertRuleRequest {
    // Puede enviarse vacío.
    // En ese caso el servidor genera UUID.
    string id = 1;

    string name = 2;

    string metric = 3;

    string operator = 4;

    double threshold = 5;

    string component_name = 6;

    bool enabled = 7;
}

message CreateAlertRuleResponse {
    bool success = 1;

    string message = 2;

    // ID definitivo de la regla.
    // Puede ser el enviado por el cliente
    // o el UUID generado por el servidor.
    string rule_id = 3;
}

// =====================================
// ACTUALIZAR REGLA DE ALERTA
// =====================================

message UpdateAlertRuleRequest {
    // ID obligatorio de la regla
    // que se desea actualizar.
    string id = 1;

    string name = 2;

    string metric = 3;

    string operator = 4;

    double threshold = 5;

    string component_name = 6;

    bool enabled = 7;
}

message UpdateAlertRuleResponse {
    bool success = 1;

    string message = 2;

    // Devuelve la regla ya actualizada.
    AlertRule rule = 3;
}

// =====================================
// ELIMINAR REGLA DE ALERTA
// =====================================

message DeleteAlertRuleRequest {
    // ID obligatorio de la regla
    // que se desea eliminar.
    string id = 1;
}

message DeleteAlertRuleResponse {
    bool success = 1;

    string message = 2;

    // ID de la regla eliminada.
    string rule_id = 3;
}

// =====================================
// CONSULTAR REGLAS DE ALERTA
// =====================================

message GetAlertRulesRequest {
}

message GetAlertRulesResponse {
    repeated AlertRule rules = 1;
}

// =====================================
// MODELO DE ALERTA GENERADA
// =====================================

message Alert {
    string id = 1;

    string rule_id = 2;
    string rule_name = 3;

    string component_id = 4;
    string component_name = 5;

    string metric = 6;

    double current_value = 7;
    double threshold = 8;

    string message = 9;

    int64 created_at = 10;

    bool active = 11;

    // 0 significa que la alerta
    // todavía no ha sido resuelta.
    int64 resolved_at = 12;
}

// =====================================
// CONSULTAR ALERTAS
// =====================================

message GetAlertsRequest {
}

message GetAlertsResponse {
    repeated Alert alerts = 1;
}

// =====================================
// RESUMEN HPC
// =====================================

message GetHpcSummaryRequest {
}

message HpcSummaryResponse {
    int64 total_jobs = 1;
    int64 pending_jobs = 2;
    int64 running_jobs = 3;
    int64 completed_jobs = 4;
    int64 failed_jobs = 5;
    int64 cancelled_jobs = 6;

    double average_execution_ms = 7;

    int64 total_nodes = 8;
    int64 available_nodes = 9;
    int64 busy_nodes = 10;
    int64 inactive_nodes = 11;

    int64 timestamp = 12;
}
